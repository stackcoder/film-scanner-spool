
name: OpenSCAD Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad xvfb

      - name: Build STL
        run: |
          openscad --hardwarnings \
            -o scanner-spool.stl scanner-spool.scad

      - name: Generate preview
        run: |
          xvfb-run -a openscad \
            --camera=35,35,10,55,0,300,250 \
            --imgsize=600,600 \
            -o preview.png <(echo "import(\"$PWD/scanner-spool.stl\");")

      - name: Upload GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF#refs/tags/}" \
            ./scanner-spool.stl \
            ./preview.png
